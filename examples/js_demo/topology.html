<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leaflet-geo-tools - 拓扑操作示例</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        .toolbar {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); min-width: 200px;
        }
        .toolbar h3 { margin: 0 0 15px 0; font-size: 16px; color: #333; border-bottom: 2px solid #008BFF; padding-bottom: 8px; }
        .toolbar button { display: block; width: 100%; margin: 5px 0; padding: 8px 12px; cursor: pointer;
            border: 1px solid #ddd; background: #fff; border-radius: 4px; font-size: 13px; }
        .toolbar button:hover { background: #f0f0f0; border-color: #008BFF; }
        .toolbar button.active { background: #008BFF; color: white; border-color: #008BFF; }
        
        .switch-container {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #f0f0f0;
        }
        .switch-label { font-size: 13px; color: #333; }
        .switch {
            position: relative; width: 44px; height: 24px; background: #ccc;
            border-radius: 12px; cursor: pointer; transition: background 0.3s;
        }
        .switch.active { background: #008BFF; }
        .switch::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            border-radius: 50%; background: white; top: 2px; left: 2px; transition: left 0.3s;
        }
        .switch.active::after { left: 22px; }
        
        .layer-list {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); max-width: 350px; max-height: 80vh; overflow-y: auto;
        }
        .layer-list h3 { margin: 0 0 15px 0; font-size: 16px; color: #333; border-bottom: 2px solid #008BFF; padding-bottom: 8px; }
        .layer-item { padding: 10px; margin: 5px 0; background: #f9f9f9; border-radius: 4px;
            border-left: 3px solid #008BFF; display: flex; justify-content: space-between; align-items: center; }
        .layer-info { flex: 1; font-size: 12px; }
        .layer-type { font-weight: bold; color: #008BFF; }
        .layer-time { color: #999; font-size: 11px; margin-top: 2px; }
        .layer-remove { background: #ff4444; color: white; border: none; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 11px; }
        .layer-remove:hover { background: #cc0000; }
        
        .help-panel {
            position: absolute; bottom: 10px; left: 10px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); max-width: 400px; display: none;
        }
        .help-panel.visible { display: block; }
        .help-panel h4 { margin: 0 0 10px 0; color: #008BFF; }
        .help-panel ol { margin: 0; padding-left: 20px; font-size: 12px; line-height: 1.8; }
        
        .api-docs {
            position: absolute; bottom: 10px; right: 10px; z-index: 1000;
            background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            max-width: 600px; max-height: 70vh; overflow: hidden; display: flex; flex-direction: column;
        }
        .api-docs-header { padding: 12px 15px; background: #008BFF; color: white; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .api-docs-content { padding: 15px; overflow-y: auto; display: none; }
        .api-docs.expanded .api-docs-content { display: block; }
        .api-class { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .api-class-name { font-size: 16px; font-weight: bold; color: #008BFF; margin-bottom: 10px; }
        .api-constructor { margin-bottom: 15px; }
        .api-constructor-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .api-params { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace;
            font-size: 12px; margin-bottom: 8px; white-space: pre-wrap; }
        .api-methods { margin-top: 10px; }
        .api-method { margin-bottom: 8px; padding-left: 15px; font-size: 12px; }
        .api-method-name { font-weight: bold; color: #008BFF; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="toolbar">
        <h3>拓扑工具</h3>
        <button id="btn-add-polygon1">添加多边形1</button>
        <button id="btn-add-polygon2">添加多边形2</button>
        <hr style="margin: 10px 0; border: none; border-top: 1px solid #eee;">
        <button id="btn-select">选择图层</button>
        <button id="btn-merge">合并</button>
        <button id="btn-clip">裁切</button>
        <button id="btn-reshape">整形</button>
        <div class="switch-container">
            <span class="switch-label">允许无选择整形</span>
            <div class="switch" id="switch-allow-no-selection"></div>
        </div>
        <div class="switch-container">
            <span class="switch-label">手动选择结果</span>
            <div class="switch" id="switch-manual-choose"></div>
        </div>
        <button id="btn-clear-topo">清除选择</button>
        <button id="btn-clear">清空所有</button>
    </div>

    <div class="layer-list">
        <h3>图层列表 <span id="layer-count" style="font-size: 12px; font-weight: normal;">(0)</span></h3>
        <div id="layer-list-content"></div>
    </div>

    <div class="help-panel" id="helpPanel">
        <h4>操作说明</h4>
        <ol>
            <li><strong>选择图层</strong>：点击"选择图层"按钮，然后点击地图上的多边形进行选择/取消选择</li>
            <li><strong>合并</strong>：选择2个或更多图层，点击"合并"按钮</li>
            <li><strong>裁切</strong>：选择1个或更多图层，点击"裁切"，然后绘制一条穿过它们的折线</li>
            <li><strong>整形</strong>：选择图层（或启用"允许无选择整形"），点击"整形"，绘制整形线</li>
            <li>所有拓扑操作的结果会自动添加到图层列表中</li>
        </ol>
    </div>

    <div class="api-docs" id="apiDocs">
        <div class="api-docs-header" onclick="toggleApiDocs()">
            <span>📖 API 文档</span>
            <span id="api-docs-toggle">▼</span>
        </div>
        <div class="api-docs-content" id="apiDocsContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet-geo-tools@latest/dist/index.js"></script>

    <script>
        console.log('检查全局变量:', window.LeafletGeoTools);
        const GeoTools = window.LeafletGeoTools;

        if (!GeoTools) {
            alert('错误：LeafletGeoTools 未加载！');
        }

        const map = L.map('map').setView([39.9, 116.4], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const topology = GeoTools.LeafletTopology.getInstance(map);
        const layers = [];
        let allowNoSelection = false;
        let manualChoose = false;

        document.getElementById('btn-add-polygon1').addEventListener('click', () => {
            const geom = {
                type: "Polygon",
                coordinates: [[
                    [116.3, 39.8],
                    [116.4, 39.8],
                    [116.4, 39.9],
                    [116.3, 39.9],
                    [116.3, 39.8]
                ]]
            };
            const editor = new GeoTools.LeafletPolygonEditor(map, {}, geom);
            const geojson = editor.geojson();
            addLayerToList({
                type: '多边形1',
                tool: editor,
                geojson: geojson,
                name: `多边形1 - ${new Date().toLocaleTimeString()}`
            });
        });

        document.getElementById('btn-add-polygon2').addEventListener('click', () => {
            const geom = {
                type: "Polygon",
                coordinates: [[
                    [116.35, 39.85],
                    [116.45, 39.85],
                    [116.45, 39.95],
                    [116.35, 39.95],
                    [116.35, 39.85]
                ]]
            };
            const editor = new GeoTools.LeafletPolygonEditor(map, {}, geom);
            const geojson = editor.geojson();
            addLayerToList({
                type: '多边形2',
                tool: editor,
                geojson: geojson,
                name: `多边形2 - ${new Date().toLocaleTimeString()}`
            });
        });

        document.getElementById('btn-select').addEventListener('click', () => {
            topology.select();
            document.getElementById('helpPanel').classList.add('visible');
            setTimeout(() => {
                document.getElementById('helpPanel').classList.remove('visible');
            }, 5000);
        });

        document.getElementById('btn-merge').addEventListener('click', () => {
            try {
                topology.merge((result) => {
                    if (result.mergedGeom) {
                        addTopoResultToLayers(result.mergedGeom, '合并结果');
                    }
                });
            } catch (e) {
                alert('错误: ' + e.message);
            }
        });

        document.getElementById('btn-clip').addEventListener('click', () => {
            try {
                document.getElementById('helpPanel').classList.add('visible');
                topology.clipByLine((result) => {
                    result.clipedGeoms.forEach((geom, idx) => {
                        addTopoResultToLayers(geom, `裁切结果 ${idx + 1}`);
                    });
                    document.getElementById('helpPanel').classList.remove('visible');
                });
            } catch (e) {
                alert('错误: ' + e.message);
                document.getElementById('helpPanel').classList.remove('visible');
            }
        });

        document.getElementById('btn-reshape').addEventListener('click', () => {
            try {
                document.getElementById('helpPanel').classList.add('visible');
                topology.reshapeFeature({
                    AllowReshapingWithoutSelection: allowNoSelection,
                    chooseStrategy: manualChoose ? 'manual' : 'auto'
                }, (result) => {
                    if (manualChoose) {
                        // 手动选择模式：返回所有候选结果
                        result.reshapedGeoms.forEach((geom, idx) => {
                            addTopoResultToLayers(geom, `整形候选 ${idx + 1}`);
                        });
                        console.log('整形候选结果（手动选择模式）:', result.reshapedGeoms);
                    } else {
                        // 自动模式：只返回最优结果
                        if (result.reshapedGeoms.length > 0) {
                            addTopoResultToLayers(result.reshapedGeoms[0], '整形结果');
                        }
                    }
                    document.getElementById('helpPanel').classList.remove('visible');
                });
            } catch (e) {
                alert('错误: ' + e.message);
                document.getElementById('helpPanel').classList.remove('visible');
            }
        });

        document.getElementById('switch-allow-no-selection').addEventListener('click', () => {
            allowNoSelection = !allowNoSelection;
            document.getElementById('switch-allow-no-selection').classList.toggle('active');
        });

        document.getElementById('switch-manual-choose').addEventListener('click', () => {
            manualChoose = !manualChoose;
            document.getElementById('switch-manual-choose').classList.toggle('active');
        });

        document.getElementById('btn-clear-topo').addEventListener('click', () => {
            topology.cleanAll();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            topology.cleanAll();
            layers.forEach(layer => {
                if (layer.tool && layer.tool.destroy) layer.tool.destroy();
            });
            layers.length = 0;
            updateLayerList();
        });

        function addTopoResultToLayers(geom, name) {
            const layer = L.geoJSON(geom, {
                style: {
                    color: '#00ff00',
                    fillColor: '#00ff00',
                    fillOpacity: 0.3,
                    weight: 2
                }
            });
            layer.addTo(map);
            
            addLayerToList({
                type: 'topo',
                tool: { destroy: () => layer.remove() },
                geojson: geom,
                name: name + ' - ' + new Date().toLocaleTimeString()
            });
        }

        function addLayerToList(layerInfo) {
            layers.push(layerInfo);
            updateLayerList();
        }

        function updateLayerList() {
            const container = document.getElementById('layer-list-content');
            const count = document.getElementById('layer-count');
            count.textContent = `(${layers.length})`;
            
            if (layers.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无图层</div>';
                return;
            }

            container.innerHTML = layers.map((layer, index) => `
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-type">${layer.type}</div>
                        <div class="layer-time">${layer.name}</div>
                    </div>
                    <button class="layer-remove" onclick="removeLayer(${index})">移除</button>
                </div>
            `).join('');
        }

        function removeLayer(index) {
            if (layers[index] && layers[index].tool) {
                if (layers[index].tool.destroy) layers[index].tool.destroy();
            }
            layers.splice(index, 1);
            updateLayerList();
        }

        function toggleApiDocs() {
            const docs = document.getElementById('apiDocs');
            const toggle = document.getElementById('api-docs-toggle');
            docs.classList.toggle('expanded');
            toggle.textContent = docs.classList.contains('expanded') ? '▲' : '▼';
        }

        document.getElementById('apiDocsContent').innerHTML = `
            <div class="api-class">
                <div class="api-class-name">LeafletTopology</div>
                <div class="api-constructor">
                    <div class="api-constructor-title">获取实例（单例模式）:</div>
                    <div class="api-params">GeoTools.LeafletTopology.getInstance(map)
                        map: L.Map - Leaflet地图实例（必需）
                        注意：这是单例模式，同一个地图实例只会返回同一个拓扑工具实例</div>
                                        </div>
                                        <div class="api-methods">
                                            <div class="api-method">
                                                <span class="api-method-name">select()</span>
                                                进入选择图层模式
                                                点击地图上的图层进行选择/取消选择
                                                选中的图层会高亮显示
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">merge(callback)</span>
                                                合并选中的图层
                                                需要至少选择2个图层
                                                callback: (result: TopoMergeResult) => void
                                                result.mergedLayers: L.GeoJSON[] - 参与合并的图层
                                                result.mergedGeom: GeoJSON.Feature | null - 合并后的几何
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">clipByLine(callback)</span>
                                                使用折线裁切选中的图层
                                                需要至少选择1个图层
                                                操作流程：选择图层 -> 点击裁切 -> 绘制裁切线 -> 双击完成
                                                callback: (result: TopoClipResult) => void
                                                result.doClipLayers: L.Layer[] - 参与裁切的图层
                                                result.clipedGeoms: GeoJSON.Feature[] - 裁切后的几何数组
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">reshapeFeature(options, callback)</span>
                                                整形要素工具
                                                options: ReshapeOptions
                                                AllowReshapingWithoutSelection?: boolean - 允许无选择整形（默认false）
                                                chooseStrategy?: 'auto' | 'manual' - 选择策略（默认'auto'）
                                                    'auto': 自动保留周长最大的结果
                                                    'manual': 返回所有候选结果，由用户选择
                                                callback: (result: TopoReshapeFeatureResult) => void
                                                result.doReshapeLayers: L.Layer[] - 参与整形的图层
                                                result.reshapedGeoms: GeoJSON.Feature[] - 整形后的几何数组
                                                操作流程：
                                                1. 选择图层（如果AllowReshapingWithoutSelection=false）
                                                2. 点击整形 -> 绘制整形线 -> 双击完成
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">cleanAll()</span>
                                                清除所有选择和高亮图层
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="api-class">
                                        <div class="api-class-name">使用示例</div>
                                        <div class="api-params">// 获取拓扑工具实例
                        const topology = GeoTools.LeafletTopology.getInstance(map);

                        // 1. 选择图层
                        topology.select();
                        // 然后点击地图上的图层进行选择

                        // 2. 合并图层
                        topology.merge((result) => {
                            console.log('合并的图层:', result.mergedLayers);
                            console.log('合并结果:', result.mergedGeom);
                            // 可以将合并结果添加到地图
                            if (result.mergedGeom) {
                                const layer = L.geoJSON(result.mergedGeom);
                                layer.addTo(map);
                            }
                        });

                        // 3. 裁切图层
                        topology.clipByLine((result) => {
                            console.log('参与裁切的图层:', result.doClipLayers);
                            console.log('裁切结果:', result.clipedGeoms);
                            // 可以将裁切结果添加到地图
                            result.clipedGeoms.forEach(geom => {
                                const layer = L.geoJSON(geom);
                                layer.addTo(map);
                            });
                        });

                        // 4. 整形要素（自动模式）
                        topology.reshapeFeature({
                            AllowReshapingWithoutSelection: false,
                            chooseStrategy: 'auto'
                        }, (result) => {
                            console.log('整形结果:', result.reshapedGeoms);
                            // 自动模式只返回最优结果
                            if (result.reshapedGeoms.length > 0) {
                                const layer = L.geoJSON(result.reshapedGeoms[0]);
                                layer.addTo(map);
                            }
                        });

                        // 5. 整形要素（手动模式）
                        topology.reshapeFeature({
                            AllowReshapingWithoutSelection: true,
                            chooseStrategy: 'manual'
                        }, (result) => {
                            console.log('整形候选结果:', result.reshapedGeoms);
                            // 手动模式返回所有候选结果，由用户选择
                            result.reshapedGeoms.forEach((geom, idx) => {
                                const layer = L.geoJSON(geom, {
                                    style: { color: idx === 0 ? 'green' : 'blue' }
                                });
                                layer.addTo(map);
                            });
                        });

                        // 6. 清除选择
                        topology.cleanAll();</div>
                                    </div>
                                    
                                    <div class="api-class">
                                        <div class="api-class-name">注意事项</div>
                                        <div class="api-params">1. 拓扑工具是单例模式，同一个地图实例只有一个实例
                        2. 选择图层时，点击已选中的图层可以取消选择
                        3. 裁切和整形操作需要先绘制一条折线
                        4. 整形操作支持线要素和面要素
                        5. 手动选择模式下，所有候选结果都会返回，需要用户自行选择保留哪一个
                        6. 所有拓扑操作的结果都需要手动添加到地图（通过回调函数）</div>
            </div>
        `;

        window.removeLayer = removeLayer;
        window.toggleApiDocs = toggleApiDocs;
    </script>
</body>
</html>
