<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leaflet-geo-tools - 编辑多边形示例</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        .toolbar {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); min-width: 200px; max-height: 90vh; overflow-y: auto;
        }
        .toolbar h3 { margin: 0 0 15px 0; font-size: 16px; color: #333; border-bottom: 2px solid #008BFF; padding-bottom: 8px; }
        .toolbar button { display: block; width: 100%; margin: 5px 0; padding: 8px 12px; cursor: pointer;
            border: 1px solid #ddd; background: #fff; border-radius: 4px; font-size: 13px; }
        .toolbar button:hover { background: #f0f0f0; border-color: #008BFF; }
        .toolbar button.active { background: #008BFF; color: white; border-color: #008BFF; }
        
        .switch-container {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #f0f0f0;
        }
        .switch-label { font-size: 13px; color: #333; }
        .switch {
            position: relative; width: 44px; height: 24px; background: #ccc;
            border-radius: 12px; cursor: pointer; transition: background 0.3s;
        }
        .switch.active { background: #008BFF; }
        .switch::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            border-radius: 50%; background: white; top: 2px; left: 2px; transition: left 0.3s;
        }
        .switch.active::after { left: 22px; }
        
        .layer-list {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); max-width: 350px; max-height: 80vh; overflow-y: auto;
        }
        .layer-list h3 { margin: 0 0 15px 0; font-size: 16px; color: #333; border-bottom: 2px solid #008BFF; padding-bottom: 8px; }
        .layer-item { padding: 10px; margin: 5px 0; background: #f9f9f9; border-radius: 4px;
            border-left: 3px solid #008BFF; display: flex; justify-content: space-between; align-items: center; }
        .layer-info { flex: 1; font-size: 12px; }
        .layer-type { font-weight: bold; color: #008BFF; }
        .layer-time { color: #999; font-size: 11px; margin-top: 2px; }
        .layer-remove { background: #ff4444; color: white; border: none; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 11px; }
        .layer-remove:hover { background: #cc0000; }
        
        .edit-toolbar {
            position: absolute; top: 10px; left: 220px; z-index: 1000;
            background: white; padding: 10px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); display: none;
        }
        .edit-toolbar.visible { display: block; }
        .edit-toolbar button { margin: 3px; padding: 6px 12px; font-size: 12px; }
        
        .help-panel {
            position: absolute; bottom: 10px; left: 10px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); max-width: 400px; display: none;
        }
        .help-panel.visible { display: block; }
        .help-panel h4 { margin: 0 0 10px 0; color: #008BFF; }
        .help-panel ol { margin: 0; padding-left: 20px; font-size: 12px; line-height: 1.8; }
        
        .api-docs {
            position: absolute; bottom: 10px; right: 10px; z-index: 1000;
            background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            max-width: 600px; max-height: 70vh; overflow: hidden; display: flex; flex-direction: column;
        }
        .api-docs-header { padding: 12px 15px; background: #008BFF; color: white; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .api-docs-content { padding: 15px; overflow-y: auto; display: none; }
        .api-docs.expanded .api-docs-content { display: block; }
        .api-class { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .api-class-name { font-size: 16px; font-weight: bold; color: #008BFF; margin-bottom: 10px; }
        .api-constructor { margin-bottom: 15px; }
        .api-constructor-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .api-params { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace;
            font-size: 12px; margin-bottom: 8px; white-space: pre-wrap; }
        .api-methods { margin-top: 10px; }
        .api-method { margin-bottom: 8px; padding-left: 15px; font-size: 12px; }
        .api-method-name { font-weight: bold; color: #008BFF; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="toolbar">
        <h3>编辑多边形</h3>
        <button id="btn-draw">绘制新多边形</button>
        <button id="btn-load-hole">加载挖孔面</button>
        <button id="btn-load-multi">加载多面</button>
        <div class="switch-container">
            <span class="switch-label">吸附（绘制/编辑）</span>
            <div class="switch" id="switch-snap"></div>
        </div>
        <div class="switch-container">
            <span class="switch-label">允许自相交</span>
            <div class="switch active" id="switch-self-intersect"></div>
        </div>
        <div class="switch-container">
            <span class="switch-label">显示中点</span>
            <div class="switch active" id="switch-midpoint"></div>
        </div>
        <div class="switch-container">
            <span class="switch-label">显示拖动边</span>
            <div class="switch active" id="switch-edge"></div>
        </div>
        <button id="btn-clear">清空所有</button>
    </div>

    <div class="edit-toolbar" id="editToolbar">
        <button id="btn-undo">撤销 (Ctrl+Z)</button>
        <button id="btn-redo">重做 (Ctrl+Shift+Z)</button>
        <button id="btn-reset">重置 (Ctrl+Alt+Z)</button>
        <button id="btn-save">保存 (Ctrl+S)</button>
    </div>

    <div class="layer-list">
        <h3>图层列表 <span id="layer-count" style="font-size: 12px; font-weight: normal;">(0)</span></h3>
        <div id="layer-list-content"></div>
    </div>

    <div class="help-panel" id="helpPanel">
        <h4>操作说明</h4>
        <ol>
            <li>支持吸附到已存在的要素顶点、边缘线（绘制和编辑时都有效）</li>
            <li>通过拖动边线上的点：实现增加新的点</li>
            <li>通过鼠标右键顶点：移除已经存在的顶点</li>
            <li>通过Ctrl + Z：撤销最后一次挪动的坐标点</li>
            <li>通过Ctrl + Shift + Z：恢复最后一次的坐标点撤销行为</li>
            <li>通过Ctrl + S 或者双击编辑中的要素：保存修改</li>
        </ol>
    </div>

    <div class="api-docs" id="apiDocs">
        <div class="api-docs-header" onclick="toggleApiDocs()">
            <span>📖 API 文档</span>
            <span id="api-docs-toggle">▼</span>
        </div>
        <div class="api-docs-content" id="apiDocsContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet-geo-tools@latest/dist/index.js"></script>

    <script>
        console.log('检查全局变量:', window.LeafletGeoTools);
        const GeoTools = window.LeafletGeoTools;

        if (!GeoTools) {
            alert('错误：LeafletGeoTools 未加载！');
        }

        const map = L.map('map').setView([39.9, 116.4], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentEditor = null;
        const layers = [];
        let snapEnabled = false; // 统一的吸附状态（同时控制绘制和编辑）
        let allowSelfIntersect = true;
        let showMidpoint = true;
        let showEdge = true;

        function collectAllGeometryForSnap() {
            const allLayers = [];
            layers.forEach(layer => {
                if (layer.tool) {
                    if (layer.tool.polygonLayer) allLayers.push(layer.tool.polygonLayer);
                    if (layer.tool.rectangleLayer) allLayers.push(layer.tool.rectangleLayer);
                    if (layer.tool.lineLayer) allLayers.push(layer.tool.lineLayer);
                    if (layer.tool.circleLayer) allLayers.push(layer.tool.circleLayer);
                }
            });
            return allLayers;
        }

        // 统一的吸附更新函数（同时更新绘制和编辑工具）
        function updateSnapForCurrentTool() {
            const snapOptions = {
                enabled: snapEnabled,
                modes: ['vertex', 'edge'],
                tolerance: 8
            };
            
            // 如果当前是编辑器
            if (currentEditor) {
                if (currentEditor.updateSnapOptions) {
                    currentEditor.updateSnapOptions(snapOptions);
                }
                if (snapEnabled) {
                    updateSnapSources();
                }
            }
        }

        function startEdit(geometry) {
            // 只清除正在编辑中的工具
            if (currentEditor) {
                const state = currentEditor.getCurrentState ? currentEditor.getCurrentState() : 'idle';
                if (state === 'drawing' || state === 'editing') {
                    if (currentEditor.destroy) currentEditor.destroy();
                }
            }

            // 使用全局吸附状态
            const snapOptions = {
                enabled: snapEnabled,
                modes: ['vertex', 'edge'],
                tolerance: 8
            };

            const editOptions = {
                enabled: true,
                dragMidMarkerOptions: {
                    enabled: showMidpoint,
                    dragMarkerStyle: {
                        icon: L.divIcon({
                            className: 'polygon-midpoint-insert',
                            html: '<div style="border-radius:50%;background:#fff;border:2px solid #f00;width:14px;height:14px"></div>',
                            iconSize: [14, 14]
                        }),
                        draggable: true,
                        pane: 'markerPane'
                    },
                    positionRatio: 0.3
                },
                dragLineMarkerOptions: {
                    enabled: showEdge,
                    dragMarkerStyle: {
                        icon: L.divIcon({
                            className: 'polygon-edge-drag',
                            html: '<div style="border-radius:50%;background:#fff;border:2px solid #0f0;width:14px;height:14px"></div>',
                            iconSize: [14, 14]
                        }),
                        draggable: true,
                        pane: 'markerPane'
                    },
                    positionRatio: 0.6
                }
            };

            currentEditor = new GeoTools.LeafletPolygonEditor(map, {
                snap: snapOptions,
                edit: editOptions,
                validation: { allowSelfIntersect: allowSelfIntersect }
            }, geometry);

            setupEditor(currentEditor);
            
            // 如果吸附已启用，设置吸附源
            if (snapEnabled) {
                updateSnapSources();
            }
            
            if (!geometry) {
                document.getElementById('helpPanel').classList.add('visible');
            }
        }

        function setupEditor(editor) {
            if (!editor) return;

            if (editor.onStateChange) {
                editor.onStateChange((state) => {
                    if (state === 'editing') {
                        document.getElementById('editToolbar').classList.add('visible');
                        document.getElementById('helpPanel').classList.add('visible');
                        // 编辑模式下也要更新吸附源
                        if (snapEnabled) {
                            updateSnapSources();
                        }
                    } else if (state === 'idle') {
                        document.getElementById('editToolbar').classList.remove('visible');
                        if (editor.getCurrentState && editor.getCurrentState() !== 'drawing') {
                            document.getElementById('helpPanel').classList.remove('visible');
                        }
                        
                        // 如果是从绘制状态转为idle，添加到图层列表
                        if (!layers.find(l => l.tool === editor)) {
                            try {
                                const geojson = editor.geojson();
                                addLayerToList({
                                    type: '多边形',
                                    tool: editor,
                                    geojson: geojson,
                                    name: `多边形 - ${new Date().toLocaleTimeString()}`
                                });
                            } catch (e) {
                                console.error('获取GeoJSON失败:', e);
                            }
                        }
                    } else if (state === 'drawing') {
                        document.getElementById('helpPanel').classList.add('visible');
                        // 绘制模式下也要更新吸附源
                        if (snapEnabled) {
                            updateSnapSources();
                        }
                    }
                });
            }

            // 双击激活编辑
            if (editor.polygonLayer) {
                editor.polygonLayer.on('dblclick', (e) => {
                    if (editor.getCurrentState && editor.getCurrentState() !== 'editing') {
                        // 双击会触发startEdit，这里不需要额外处理
                    }
                });
            }
        }

        function updateSnapSources() {
            if (!snapEnabled || !currentEditor) return;
            
            const excludeLayers = [];
            if (currentEditor.polygonLayer) excludeLayers.push(currentEditor.polygonLayer);
            
            const otherLayers = collectAllGeometryForSnap();
            excludeLayers.push(...otherLayers);

            if (currentEditor.setSnapSources) {
                currentEditor.setSnapSources(excludeLayers);
            }
        }

        document.getElementById('btn-draw').addEventListener('click', () => {
            startEdit(null);
        });

        document.getElementById('btn-load-hole').addEventListener('click', () => {
            const geometry = {
                type: "Polygon",
                coordinates: [
                    [[116.3, 39.8], [116.5, 39.8], [116.5, 40.0], [116.3, 40.0], [116.3, 39.8]],
                    [[116.35, 39.85], [116.45, 39.85], [116.45, 39.95], [116.35, 39.95], [116.35, 39.85]]
                ]
            };
            startEdit(geometry);
            const geojson = currentEditor.geojson();
            addLayerToList({
                type: '挖孔面',
                tool: currentEditor,
                geojson: geojson,
                name: `挖孔面 - ${new Date().toLocaleTimeString()}`
            });
        });

        document.getElementById('btn-load-multi').addEventListener('click', () => {
            const geometry = {
                type: "MultiPolygon",
                coordinates: [
                    [[[116.3, 39.8], [116.4, 39.8], [116.4, 39.9], [116.3, 39.9], [116.3, 39.8]]],
                    [[[116.35, 39.85], [116.45, 39.85], [116.45, 39.95], [116.35, 39.95], [116.35, 39.85]]]
                ]
            };
            startEdit(geometry);
            const geojson = currentEditor.geojson();
            addLayerToList({
                type: '多面',
                tool: currentEditor,
                geojson: geojson,
                name: `多面 - ${new Date().toLocaleTimeString()}`
            });
        });

        // 统一的吸附开关（同时控制绘制和编辑）
        document.getElementById('switch-snap').addEventListener('click', () => {
            snapEnabled = !snapEnabled;
            document.getElementById('switch-snap').classList.toggle('active');
            
            // 更新当前工具的吸附配置（无论是绘制还是编辑）
            updateSnapForCurrentTool();
        });

        document.getElementById('switch-self-intersect').addEventListener('click', () => {
            allowSelfIntersect = !allowSelfIntersect;
            document.getElementById('switch-self-intersect').classList.toggle('active');
            if (currentEditor && currentEditor.setValidationRules) {
                currentEditor.setValidationRules({ allowSelfIntersect: allowSelfIntersect });
            }
        });

        document.getElementById('switch-midpoint').addEventListener('click', () => {
            showMidpoint = !showMidpoint;
            document.getElementById('switch-midpoint').classList.toggle('active');
            if (currentEditor && currentEditor.updateEditOptions) {
                currentEditor.updateEditOptions({
                    dragMidMarkerOptions: { enabled: showMidpoint }
                });
            }
        });

        document.getElementById('switch-edge').addEventListener('click', () => {
            showEdge = !showEdge;
            document.getElementById('switch-edge').classList.toggle('active');
            if (currentEditor && currentEditor.updateEditOptions) {
                currentEditor.updateEditOptions({
                    dragLineMarkerOptions: { enabled: showEdge }
                });
            }
        });

        document.getElementById('btn-undo').addEventListener('click', () => {
            if (currentEditor) {
                const state = currentEditor.getCurrentState ? currentEditor.getCurrentState() : 'idle';
                if (state === 'drawing' && currentEditor.undoDraw) {
                    currentEditor.undoDraw();
                } else if (currentEditor.undoEdit) {
                    currentEditor.undoEdit();
                }
            }
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            if (currentEditor && currentEditor.redoEdit) {
                currentEditor.redoEdit();
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (currentEditor && currentEditor.resetToInitial) {
                if (confirm('确定要重置到初始状态吗？')) {
                    currentEditor.resetToInitial();
                }
            }
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            if (currentEditor && currentEditor.commitEdit) {
                currentEditor.commitEdit();
                if (currentEditor.geojson) {
                    const geojson = currentEditor.geojson();
                    console.log('保存的GeoJSON:', geojson);
                }
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z' && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                if (currentEditor) {
                    const state = currentEditor.getCurrentState ? currentEditor.getCurrentState() : 'idle';
                    if (state === 'drawing' && currentEditor.undoDraw) {
                        currentEditor.undoDraw();
                    } else if (currentEditor.undoEdit) {
                        currentEditor.undoEdit();
                    }
                }
            } else if (e.ctrlKey && e.shiftKey && e.key === 'z') {
                e.preventDefault();
                if (currentEditor && currentEditor.redoEdit) {
                    currentEditor.redoEdit();
                }
            } else if (e.ctrlKey && e.altKey && e.key === 'z') {
                e.preventDefault();
                if (currentEditor && currentEditor.resetToInitial) {
                    if (confirm('确定要重置到初始状态吗？')) {
                        currentEditor.resetToInitial();
                    }
                }
            } else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                if (currentEditor && currentEditor.commitEdit) {
                    currentEditor.commitEdit();
                }
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if (currentEditor && currentEditor.destroy) currentEditor.destroy();
            currentEditor = null;
            layers.forEach(layer => {
                if (layer.tool && layer.tool.destroy) layer.tool.destroy();
            });
            layers.length = 0;
            updateLayerList();
            document.getElementById('editToolbar').classList.remove('visible');
            document.getElementById('helpPanel').classList.remove('visible');
        });

        function addLayerToList(layerInfo) {
            layers.push(layerInfo);
            updateLayerList();
        }

        function updateLayerList() {
            const container = document.getElementById('layer-list-content');
            const count = document.getElementById('layer-count');
            count.textContent = `(${layers.length})`;
            
            if (layers.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无图层</div>';
                return;
            }

            container.innerHTML = layers.map((layer, index) => `
                <div class="layer-item">
                    <div class="layer-info">
                        <div class="layer-type">${layer.type}</div>
                        <div class="layer-time">${layer.name}</div>
                    </div>
                    <button class="layer-remove" onclick="removeLayer(${index})">移除</button>
                </div>
            `).join('');
        }

        function removeLayer(index) {
            if (layers[index] && layers[index].tool) {
                if (layers[index].tool.destroy) layers[index].tool.destroy();
            }
            layers.splice(index, 1);
            updateLayerList();
            // 移除图层后，如果吸附开启，需要更新吸附源
            if (snapEnabled) {
                updateSnapSources();
            }
        }

        function toggleApiDocs() {
            const docs = document.getElementById('apiDocs');
            const toggle = document.getElementById('api-docs-toggle');
            docs.classList.toggle('expanded');
            toggle.textContent = docs.classList.contains('expanded') ? '▲' : '▼';
        }

        document.getElementById('apiDocsContent').innerHTML = `
            <div class="api-class">
                <div class="api-class-name">LeafletPolygonEditor</div>
                <div class="api-constructor">
                    <div class="api-constructor-title">构造函数（无默认geometry）:</div>
                    <div class="api-params">new GeoTools.LeafletPolygonEditor(map, options?)
                        map: L.Map - Leaflet地图实例（必需）
                        options: LeafletToolsOptions（可选）
                        defaultStyle?: L.PolylineOptions - 默认样式
                        validErrorPolygonStyle?: L.PolylineOptions - 校验失败时的样式
                        
                        snap?: SnapOptions - 吸附配置（绘制和编辑时都有效）
                            enabled: boolean - 是否启用吸附
                            modes: Array<'vertex' | 'edge'> - 吸附模式
                            tolerance?: number - 吸附阈值（像素）
                            highlight?: {
                            enabled?: boolean
                            pointStyle?: L.CircleMarkerOptions
                            edgeStyle?: L.PolylineOptions
                            }
                        
                        edit?: EditOptionsExpends - 编辑配置
                            enabled: boolean - 是否启用编辑
                            vertexsMarkerStyle?: L.MarkerOptions - 顶点样式
                            dragMidMarkerOptions?: {
                            enabled: boolean - 是否显示中点
                            dragMarkerStyle?: L.MarkerOptions - 中点样式
                            positionRatio?: number - 中点位置比例（0-1，默认0.3）
                            }
                            dragLineMarkerOptions?: {
                            enabled: boolean - 是否显示拖动边
                            dragMarkerStyle?: L.MarkerOptions - 拖动边样式
                            positionRatio?: number - 拖动边位置比例（0-1，默认0.6）
                            }
                        
                        validation?: ValidationOptions - 校验配置
                            allowSelfIntersect?: boolean - 是否允许自相交</div>
                                            
                                            <div class="api-constructor-title">构造函数（有默认geometry）:</div>
                                            <div class="api-params">new GeoTools.LeafletPolygonEditor(map, options?, defaultGeometry)

                        defaultGeometry: GeoJSON.Geometry - 支持：
                        - Polygon（单面，可含挖孔）
                        - MultiPolygon（多面）</div>
                                        </div>
                                        <div class="api-methods">
                                            <div class="api-method">
                                                <span class="api-method-name">geojson()</span>
                                                返回: GeoJSON.Feature - 获取多边形GeoJSON数据
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">destroy()</span>
                                                销毁图层，从地图中移除并清理资源
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">onStateChange(listener, configs?)</span>
                                                监听状态变化
                                                listener: (state: 'idle' | 'drawing' | 'editing') => void
                                                configs: { immediateNotify?: boolean }
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">getCurrentState()</span>
                                                返回: 'idle' | 'drawing' | 'editing' - 获取当前状态
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">undoDraw()</span>
                                                撤销绘制时最后一个点（仅在drawing状态有效）
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">undoEdit()</span>
                                                撤销编辑操作
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">redoEdit()</span>
                                                重做编辑操作
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">resetToInitial()</span>
                                                重置到初始状态
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">commitEdit()</span>
                                                完成编辑，保存修改
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">updateSnapOptions(options)</span>
                                                动态更新吸附配置（绘制和编辑时都有效）
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">updateEditOptions(options)</span>
                                                动态更新编辑配置（可更新中点、拖动边的显示）
                                                options: { dragMidMarkerOptions?: {...}, dragLineMarkerOptions?: {...} }
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">setValidationRules(rules)</span>
                                                动态更新校验规则
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">setSnapSources(excludeLayers)</span>
                                                设置吸附源（其他图层的几何信息）
                                                excludeLayers: L.Layer[] - 要排除的图层数组
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">setVisible(visible)</span>
                                                设置图层显隐
                                            </div>
                                            <div class="api-method">
                                                <span class="api-method-name">getLayerVisible()</span>
                                                返回: boolean - 获取图层显隐状态
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="api-class">
                                        <div class="api-class-name">使用示例</div>
                                        <div class="api-params">// 1. 绘制新多边形（带吸附）
                        const editor = new GeoTools.LeafletPolygonEditor(map, {
                            snap: { enabled: true, modes: ['vertex', 'edge'] },
                            edit: {
                                enabled: true,
                                dragMidMarkerOptions: { enabled: true },
                                dragLineMarkerOptions: { enabled: true }
                            },
                            validation: { allowSelfIntersect: false }
                        });

                        // 2. 编辑已有多边形（支持挖孔、多面）
                        const geometry = {
                            type: "Polygon",
                            coordinates: [
                                [[116.3, 39.8], [116.5, 39.8], [116.5, 40.0], [116.3, 40.0], [116.3, 39.8]],
                                [[116.35, 39.85], [116.45, 39.85], [116.45, 39.95], [116.35, 39.95], [116.35, 39.85]]
                            ]
                        };
                        const editor = new GeoTools.LeafletPolygonEditor(map, {}, geometry);

                        // 3. 动态开启/关闭吸附（绘制和编辑时都有效）
                        editor.updateSnapOptions({ enabled: true });

                        // 4. 设置吸附源（吸附到其他图层）
                        const otherLayers = [layer1, layer2];
                        editor.setSnapSources(otherLayers);

                        // 5. 监听状态变化
                        editor.onStateChange((state) => {
                            if (state === 'editing') {
                                console.log('进入编辑模式');
                                // 编辑模式下也可以更新吸附源
                                editor.setSnapSources(otherLayers);
                            } else if (state === 'idle') {
                                const geojson = editor.geojson();
                                console.log('编辑完成:', geojson);
                            }
                        });

                        // 6. 编辑操作
                        editor.undoEdit();      // 撤销
                        editor.redoEdit();      // 重做
                        editor.resetToInitial(); // 重置
                        editor.commitEdit();     // 保存</div>
            </div>
        `;

        window.removeLayer = removeLayer;
        window.toggleApiDocs = toggleApiDocs;
    </script>
</body>
</html>
