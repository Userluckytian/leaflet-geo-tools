<!DOCTYPE html>
<html>

<head>
    <title>Leaflet Geo Tools - 完整绘制演示</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 600px;
            margin-top: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .toolbar {
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .toolbar-group {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ccc;
        }

        .toolbar-group:last-child {
            border-bottom: none;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            min-width: 120px;
        }

        button:hover {
            background: #005fa3;
        }

        button.active {
            background: #ff6b6b;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
        }

        .status {
            margin: 10px 0;
            padding: 10px;
            background: #e6f7ff;
            border-left: 4px solid #007acc;
            border-radius: 4px;
        }

        .feature-list {
            margin-top: 10px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .feature-item {
            padding: 8px;
            margin: 5px 0;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 3px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feature-actions button {
            padding: 3px 8px;
            font-size: 11px;
            margin-left: 5px;
            min-width: auto;
        }
    </style>
</head>

<body>
    <h1>Leaflet Geo Tools - 完整绘制演示</h1>

    <div class="status" id="status">状态: 准备就绪</div>

    <div class="toolbar">
        <div class="toolbar-group">
            <h3>📝 绘制工具</h3>
            <button id="drawMarker">📍 点 (Marker)</button>
            <button id="drawPolyline">📏 线 (Polyline)</button>
            <button id="drawPolygon">🔷 多边形 (Polygon)</button>
            <button id="drawRectangle">⬜ 矩形 (Rectangle)</button>
            <button id="drawCircle">⭕ 圆形 (Circle)</button>
        </div>

        <div class="toolbar-group">
            <h3>🛠️ 操作控制</h3>
            <button id="stopDrawing" disabled>🛑 停止绘制</button>
            <button id="clearAll">🧹 清除所有</button>
            <button id="toggleView">🗺️ 居中显示</button>
        </div>

        <div class="toolbar-group">
            <h3>💾 数据操作</h3>
            <button id="exportAll">📋 导出所有数据 (GeoJSON)</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="toolbar">
        <h4>已创建要素列表</h4>
        <div id="featureList" class="feature-list"></div>
    </div>

    <div id="log"></div>

    <!-- 依赖库 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

    <!-- 你的库 -->
    <script src="https://unpkg.com/leaflet-geo-tools@latest/dist/index.js"></script>

    <script>
        // 检查库是否加载成功
        console.log('检查全局变量:', window.LeafletGeoTools);

        // 获取库的引用
        const GeoTools = window.LeafletGeoTools;

        if (!GeoTools) {
            alert('错误: LeafletGeoTools 库未加载成功！请检查：\n1. 是否正确构建了 dist/index.js\n2. 路径是否正确\n3. 控制台查看错误信息');
            console.error('可用的全局变量:', Object.keys(window));
        } else {
            console.log('库加载成功！可用的类:', Object.keys(GeoTools));
        }

        // 初始化地图
        const map = L.map('map').setView([31.2304, 121.4737], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 状态管理
        let currentEditor = null;
        const features = []; // 存储所有创建的要素实例
        let activeMode = null; // 当前激活的绘制模式

        // DOM 元素
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const featureListEl = document.getElementById('featureList');

        // 日志函数
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌ ' : type === 'success' ? '✅ ' : 'ℹ️ ';
            logEl.innerHTML += `[${time}] ${prefix}${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 更新状态
        function updateStatus(message) {
            statusEl.textContent = `状态: ${message}`;
            log(message);
        }

        // 更新要素列表显示
        function updateFeatureList() {
            featureListEl.innerHTML = '';
            features.forEach((feature, index) => {
                const item = document.createElement('div');
                item.className = 'feature-item';

                // 获取要素类型
                let type = '未知';
                if (feature.constructor.name.includes('Marker')) type = '点';
                else if (feature.constructor.name.includes('Polyline')) type = '线';
                else if (feature.constructor.name.includes('Polygon')) type = '多边形';
                else if (feature.constructor.name.includes('Rectangle')) type = '矩形';
                else if (feature.constructor.name.includes('Circle')) type = '圆形';

                item.innerHTML = `
                    <span>${index + 1}. ${type}</span>
                    <div class="feature-actions">
                        <button onclick="viewFeature(${index})">查看</button>
                        <button onclick="removeFeature(${index})">删除</button>
                    </div>
                `;
                featureListEl.appendChild(item);
            });
        }

        // 全局函数 - 查看要素
        window.viewFeature = function (index) {
            if (features[index] && features[index].geojson) {
                try {
                    const geojson = features[index].geojson();
                    log(`查看 ${features[index].constructor.name} ${index + 1}:`);
                    log(JSON.stringify(geojson, null, 2), 'info');

                    // 定位到要素
                    if (geojson.geometry.type === 'Point') {
                        map.setView([geojson.geometry.coordinates[1], geojson.geometry.coordinates[0]], 16);
                    } else {
                        // 对于面和线，计算边界
                        const bounds = L.geoJSON(geojson).getBounds();
                        map.fitBounds(bounds, { padding: [50, 50] });
                    }
                } catch (error) {
                    log(`获取要素坐标失败: ${error.message}`, 'error');
                }
            }
        };

        // 全局函数 - 删除要素
        window.removeFeature = function (index) {
            if (features[index]) {
                try {
                    if (features[index].destroy) features[index].destroy();

                    features.splice(index, 1);
                    updateStatus(`已删除要素 ${index + 1}`);
                    updateFeatureList();
                } catch (error) {
                    log(`删除失败: ${error.message}`, 'error');
                }
            }
        };

        // 禁用/启用所有绘制按钮
        function disableAllButtons(disabled) {
            ['drawMarker', 'drawPolyline', 'drawPolygon', 'drawRectangle', 'drawCircle']
                .forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = disabled;
                });

            document.getElementById('stopDrawing').disabled = !disabled;
        }

        // 清除当前编辑器的激活状态
        function deactivateCurrentEditor() {
            if (currentEditor) {
                try {
                    if (currentEditor.destroy) currentEditor.destroy();
                } catch (error) {
                    // 忽略错误
                }
                currentEditor = null;
            }
            disableAllButtons(false);
            updateStatus('已停止当前操作');
        }

        // 通用绘制函数
        function startDrawing(editorClass, modeName, buttonId) {
            console.log('geo', GeoTools);

            if (!GeoTools) {
                updateStatus('错误: 库未加载');
                return;
            }

            // 查找编辑器类
            const EditorClass = GeoTools[editorClass];

            if (!EditorClass) {
                updateStatus(`错误: 未找到 ${modeName} 编辑器类`);
                log('可用的类: ' + Object.keys(GeoTools).join(', '), 'error');
                return;
            }

            deactivateCurrentEditor();

            try {
                updateStatus(`开始绘制 ${modeName} - ${getDrawingInstructions(modeName)}`);

                // 创建新的编辑器
                currentEditor = new EditorClass(map);
                features.push(currentEditor);
                activeMode = modeName;

                // 监听状态变化
                if (currentEditor.onStateChange) {
                    currentEditor.onStateChange((state) => {
                        updateStatus(`${modeName} 状态: ${state}`);

                        if (state === GeoTools.PolygonEditorState.Idle) {
                            // 绘制完成
                            disableAllButtons(false);
                            updateStatus(`${modeName} 绘制完成`);

                            // 获取数据
                            if (currentEditor.geojson) {
                                const geojson = currentEditor.geojson();
                                log(`新的 ${modeName} 数据:`, 'success');
                                log(JSON.stringify(geojson, null, 2));
                            }

                            currentEditor = null;
                            activeMode = null;
                            updateFeatureList();
                        } else if (state === GeoTools.PolygonEditorState.Drawing) {
                            // 正在绘制
                            disableAllButtons(true);
                        }
                    });
                }

                // 更新UI
                document.getElementById(buttonId).classList.add('active');
                document.getElementById('stopDrawing').disabled = false;

                log(`${modeName} 编辑器已创建，类名: ${EditorClass.name}`, 'success');

            } catch (error) {
                updateStatus(`创建 ${modeName} 编辑器失败: ${error.message}`, 'error');
                log(`错误详情: ${error.stack}`, 'error');
                currentEditor = null;
                activeMode = null;
            }
        }

        // 获取绘制说明
        function getDrawingInstructions(modeName) {
            const instructions = {
                '点': '点击地图添加标记',
                '线': '点击添加顶点，双击结束绘制',
                '多边形': '点击添加顶点，双击结束绘制',
                '矩形': '点击并拖动绘制',
                '圆形': '点击确定圆心，拖动确定半径'
            };
            return instructions[modeName] || '请参考对应工具的绘制说明';
        }

        // 按钮事件绑定
        document.getElementById('drawMarker').addEventListener('click', () =>
            startDrawing('MarkerPoint', '点', 'drawMarker'));

        document.getElementById('drawPolyline').addEventListener('click', () =>
            startDrawing('LeafletPolyline', '线', 'drawPolyline'));

        document.getElementById('drawPolygon').addEventListener('click', () =>
            startDrawing('LeafletPolygon', '多边形', 'drawPolygon'));

        document.getElementById('drawRectangle').addEventListener('click', () =>
            startDrawing('LeafletRectangle', '矩形', 'drawRectangle'));

        document.getElementById('drawCircle').addEventListener('click', () =>
            startDrawing('LeafletCircle', '圆形', 'drawCircle'));

        // 停止绘制
        document.getElementById('stopDrawing').addEventListener('click', deactivateCurrentEditor);

        // 清除所有
        document.getElementById('clearAll').addEventListener('click', () => {
            features.forEach(feature => {
                try {
                    if (feature.destroy) feature.destroy();
                } catch (error) {
                    // 忽略错误
                }
            });

            features.length = 0;
            currentEditor = null;
            activeMode = null;

            updateStatus('已清除所有要素');
            updateFeatureList();
            disableAllButtons(false);

            // 移除所有按钮的active状态
            document.querySelectorAll('button.active').forEach(btn =>
                btn.classList.remove('active'));
        });

        // 居中显示
        document.getElementById('toggleView').addEventListener('click', () => {
            if (features.length > 0) {
                // 计算所有要素的边界
                let bounds = L.latLngBounds([]);
                features.forEach(feature => {
                    if (feature.getLayer) {
                        const layer = feature.getLayer();
                        if (layer.getBounds) {
                            bounds.extend(layer.getBounds());
                        } else if (layer.getLatLng) {
                            bounds.extend(layer.getLatLng());
                        }
                    }
                });
                map.fitBounds(bounds, { padding: [50, 50] });
            } else {
                map.setView([31.2304, 121.4737], 13);
            }
            updateStatus('地图已居中显示');
        });

        // 导出所有数据
        document.getElementById('exportAll').addEventListener('click', () => {
            log('=== 所有要素的 GeoJSON 数据 ===', 'info');

            if (features.length === 0) {
                log('没有要素数据', 'info');
                return;
            }

            const featureCollection = {
                type: "FeatureCollection",
                features: []
            };

            features.forEach((feature, index) => {
                if (feature.geojson) {
                    try {
                        const geojson = feature.geojson();
                        featureCollection.features.push(geojson);
                        log(`要素 ${index + 1} (${feature.constructor.name}):`, 'info');
                        log(JSON.stringify(geojson, null, 2));
                    } catch (error) {
                        log(`获取要素 ${index + 1} 数据失败: ${error.message}`, 'error');
                    }
                } else {
                    log(`要素 ${index + 1}: 没有 geojson() 方法`, 'error');
                }
            });

            // 提供下载链接
            const dataStr = JSON.stringify(featureCollection, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const exportFileDefaultName = `leaflet-geo-tools-export-${new Date().getTime()}.json`;

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();

            log(`数据已导出，共 ${features.length} 个要素`, 'success');
        });


        // 初始化日志
        log('Leaflet Geo Tools 完整演示页面已加载', 'success');
        log('地图中心: [31.2304, 121.4737] (上海)', 'info');
        log('可用的编辑器类: ' + (GeoTools ? Object.keys(GeoTools).join(', ') : '无'), 'info');

        // 添加一些初始化提示
        setTimeout(() => {
            if (GeoTools) {
                updateStatus('就绪 - 点击上方按钮开始绘制');
            }
        }, 1000);
    </script>
</body>

</html>
